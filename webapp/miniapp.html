<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Torneo biliardino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:"Bebas";src:url(/assets/BebasNeue-Regular.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Yellowtail";src:url(/assets/Yellowtail-Regular.ttf) format("truetype");font-display:swap}
:root{
  /* colori della locandina del circolo */
  --teal:#22bdb7; --magenta:#d4008f; --lime:#b8f53f;
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f2f5);
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8f98);
  --acc:var(--magenta);
  --acc-tx:#fff;
  --link:var(--tg-theme-link-color,#2f7de1);
  --red:var(--tg-theme-destructive-text-color,#e5484d);
  --ok:#2e9f5b; --warn:#d98a00;
  --line:color-mix(in srgb,var(--tx) 10%,transparent);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg2);color:var(--tx);font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{background:var(--teal);padding:10px 16px 10px 12px;display:flex;align-items:center;gap:10px}
.brand img{height:46px;width:auto;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.brand .t{min-width:0}
h1{font:400 26px/1 "Bebas",Impact,sans-serif;letter-spacing:.02em;margin:0;color:#fff;text-shadow:2px 2px 0 var(--magenta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:#08302f;font-size:13px;font-weight:600}
nav{padding:0 12px}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav button{flex:1;min-width:max-content;border:0;background:none;color:var(--hint);font:600 14px inherit;font-family:inherit;padding:10px 8px;border-bottom:2px solid transparent}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{padding:12px 12px 0}
section{margin-bottom:18px}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--hint);margin:6px 6px 8px;font-weight:600}
.card{background:var(--bg);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.match{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.match .lab{grid-column:1/-1;font-size:12px;color:var(--hint);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.team{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.win{color:var(--ok)}
.team.lose{color:var(--hint);font-weight:500}
.score{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--bg2);color:var(--hint)}
.pill.live{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.mine{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
button.b{border:0;border-radius:10px;padding:9px 12px;font:600 14px inherit;font-family:inherit;background:var(--bg2);color:var(--tx)}
button.b.pri{background:var(--acc);color:var(--acc-tx)}
button.b.red{color:var(--red)}
button.b.big{width:100%;padding:13px;font-size:15px}
button.b:disabled{opacity:.45}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;text-align:right;font-size:14px}
th{font-size:11px;color:var(--hint);font-weight:600}
td:nth-child(2),th:nth-child(2){text-align:left;width:100%}
td:first-child{color:var(--hint);width:1.5em}
tr+tr td{border-top:1px solid var(--line)}
.rit{text-decoration:line-through;color:var(--hint)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0}
.row+.row{border-top:1px solid var(--line)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:9px;border:0;background:var(--bg2);color:var(--tx);font-size:18px}
.step span{min-width:2ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font:600 13px inherit;font-family:inherit;color:var(--tx)}
.seg button.on{background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select{font:inherit;padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);max-width:100%}
.muted{color:var(--hint);font-size:13px}
/* pannello Tornei */
input.t,textarea.t{font:inherit;width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
textarea.t{min-height:64px;resize:vertical}
.duo{display:flex;gap:6px}.duo input{flex:1;min-width:0}
.campo{margin:6px 0}.campo label{display:block;font-size:12px;color:var(--hint);margin:0 0 3px 2px}
.ok-line{color:var(--ok);font-weight:600;font-size:13px;margin-top:6px}
.prev-podio{white-space:pre-wrap}.prev-podio img{width:100%;border-radius:10px;margin-bottom:8px;display:block}
.tap{cursor:pointer}
/* scheda Sfide */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{border:1.5px dashed var(--line);background:none;border-radius:10px;padding:11px 6px;font:600 14px inherit;font-family:inherit;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.on{border-style:solid;border-color:var(--teal);color:var(--tx);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.contro{text-align:center;font:400 20px/1 "Bebas",Impact,sans-serif;color:var(--acc);margin:8px 0;letter-spacing:.05em}
.elenco{max-height:52vh;overflow:auto;margin-top:8px}
.elenco button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;font:500 15px inherit;font-family:inherit;color:var(--tx)}
.elenco button.nuovo{color:var(--acc);font-weight:700}
.sfida-r{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center}
.sfida-r .x{font-weight:800;font-variant-numeric:tabular-nums;text-align:center;min-width:3.2em}
.sfida-r .dx{text-align:right}
.empty{text-align:center;color:var(--hint);padding:28px 10px}
.podio{display:grid;gap:6px}
.podio div{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:30;transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .2s,visibility .2s}
.toast.on{transform:none;visibility:visible}.toast.err{background:var(--red)}
/* foglio risultato */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s}
.sheet.on{transform:none}.veil.on{display:block}
.game{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.game .who{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.game .who button{border:1.5px solid var(--line);background:none;border-radius:10px;padding:10px 6px;font:600 14px inherit;font-family:inherit;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game .who button.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{width:40px;height:38px;border-radius:9px;border:0;background:var(--bg2);color:var(--tx);font:700 15px inherit;font-family:inherit}
.chips button.on{background:var(--acc);color:var(--acc-tx)}
.sum{font-size:22px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.prova{display:none;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#fff3c4;color:#5c4500;font-size:13px;font-weight:600}
.prova span{flex:1;min-width:150px}
.prova button{border:0;border-radius:9px;padding:7px 10px;background:#5c4500;color:#fff;font:600 13px inherit;font-family:inherit}
.b small{font-weight:500;opacity:.85}
/* tabellone a farfalla */
.brk-wrap{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:var(--r);padding:10px 8px 18px;overscroll-behavior-x:contain}
.brk{position:relative}
.brk svg{position:absolute;left:0;top:0;pointer-events:none}
.brk path{fill:none;stroke:color-mix(in srgb,var(--tx) 28%,transparent);stroke-width:1.5}
.brk .ch{position:absolute;top:0;width:158px;font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.brk .ch.fin{color:var(--acc)}
.bx{position:absolute;width:158px;height:52px;background:var(--bg2);border:1.5px solid var(--line);border-radius:9px;padding:4px 8px;display:grid;grid-template-rows:1fr 1fr;font-size:12.5px;line-height:1.1}
.bx.ck{cursor:pointer}.bx.ck:active{transform:scale(.98)}
.bx .r{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.bx .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bx .r b{font-variant-numeric:tabular-nums}
.bx .r.w{font-weight:700;color:var(--ok)}.bx .r.l{color:var(--hint)}
.bx.live{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 22%,transparent)}
.bx.mine{background:color-mix(in srgb,var(--acc) 13%,var(--bg))}
.bx.bye{opacity:.5}
.bx .tag{position:absolute;top:-9px;left:8px;font-size:9.5px;font-weight:700;background:var(--acc);color:#fff;border-radius:6px;padding:1px 5px}
.bx .tag.warn{background:var(--warn)}
.bx .lt{position:absolute;right:-22px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.bx .ltin{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--teal);color:#fff;font-size:9.5px;margin-right:4px;vertical-align:1px}
.bx .cap{position:absolute;left:2px;bottom:-15px;font-size:9.5px;color:var(--hint);white-space:nowrap}
/* ---- PC (Telegram Desktop / finestre larghe) ---- */
@media (min-width: 900px){
  .brand,nav,.prova{padding-left:max(16px,calc((100% - 1280px)/2));padding-right:max(16px,calc((100% - 1280px)/2))}
  nav button{flex:0 1 200px}
  main{max-width:1280px;margin:0 auto;padding:16px 16px 0}
  main.v-tabellone{max-width:none}   /* il tabellone usa tutta la finestra */
  main.v-sfide{max-width:640px}      /* sfide: modulo stretto, come su telefono */
  /* partite: card affiancate */
  main.v-partite section{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;align-items:start}
  main.v-partite section>:not(.card){grid-column:1/-1}
  main.v-partite section>.card{margin:0;height:100%;box-sizing:border-box}
  /* gironi: classifiche affiancate */
  main.v-gironi{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px;align-items:start}
  main.v-gironi>p{grid-column:1/-1}
  /* gestione: due colonne */
  main.v-admin{column-count:2;column-gap:16px}
  main.v-admin section{break-inside:avoid}
  /* tabellone: turni in colonna, uno accanto all'altro */
  .turni{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:6px}
  .turni>section{flex:0 0 270px;margin:0}
  /* foglio risultato e avvisi: centrati, non larghi quanto lo schermo */
  .sheet{left:50%;right:auto;width:520px;transform:translate(-50%,105%)}
  .sheet.on{transform:translate(-50%,0)}
  .toast{left:50%;right:auto;width:420px;margin-left:-210px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/static/mascotte.png" alt=""><div class="t">
    <h1 id="titolo">Torneo</h1>
    <div class="sub" id="sottotitolo">Caricamento…</div></div></div>
  <nav id="tabs"></nav>
  <div id="prova" class="prova"></div>
</header>
<main id="main"></main>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const INIT = tg ? tg.initData : "";
let S = null, tab = null, foglioAperto = false, bozza = {};
// link diretto t.me/<bot>/sfide?startapp=sfide: si apre sulla scheda Sfide
// ?startapp=iscrizione (bottone «Iscriviti» sotto lista e locandina): scheda Iscrizione
try { const sp = window.Telegram?.WebApp?.initDataUnsafe?.start_param || ""; if (["sfide","iscrizione"].includes(sp)) tab = sp; } catch(e) {}
const FASI = {nessuna:"Da preparare", iscrizioni:"Pronto per i gironi", gironi:"Gironi in corso", ko:"Tabellone a eliminazione", finito:"Concluso"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vibra = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch(e){} };

function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(err?" err":""); clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast",2600); }

async function carica(forza){
  if (!INIT) { $("#main").innerHTML = '<div class="empty">Apri questa pagina dal bot su Telegram (comando /app).</div>'; $("#sottotitolo").textContent=""; return; }
  try{
    const r = await fetch("/api/stato" + (S && !forza ? "?v=" + encodeURIComponent(S.versione) : ""), {headers:{"X-Init-Data":INIT}});
    if (r.status === 401) { $("#main").innerHTML='<div class="empty">Sessione scaduta: chiudi e riapri l\'app.</div>'; return; }
    const d = await r.json();
    if (d.invariato) return;
    const primo = !S;
    S = d; if (!foglioAperto && (!["tornei","sfide","iscrizione"].includes(tab) || primo)) render();
    if (primo && tab === "tornei") caricaPannello();
    if (primo && tab === "iscrizione") caricaIscrizione();
    if (primo && tab === "sfide") caricaSfide();
  }catch(e){ /* rete assente: riprova al prossimo giro */ }
}

async function azione(dati, okMsg){
  try{
    const r = await fetch("/api/azione", {method:"POST", headers:{"X-Init-Data":INIT,"Content-Type":"application/json"}, body:JSON.stringify(dati)});
    const d = await r.json();
    if (!d.ok){ vibra("error"); toast(d.errore || "Errore", true); return null; }
    vibra("success"); if (okMsg) toast(okMsg);
    await carica(true);
    return d;
  }catch(e){ toast("Connessione assente", true); return null; }
}

/* ---------- utilità partite ---------- */
let vistaGiocatore = false;   // solo in prova: l'admin vede l'app come un giocatore
const admin = () => S.ruolo && S.ruolo.admin && !vistaGiocatore;
const veroAdmin = () => S.ruolo && S.ruolo.admin;
const mie = () => (S.ruolo && S.ruolo.coppie) || [];
const eMia = p => mie().includes(p.a) || mie().includes(p.b);
const sospesa = p => (S.sospese || []).includes(p.id);
const mancanti = c => ((S.assenti || {})[c] || []);
const bloccata = p => mancanti(p.a).length || mancanti(p.b).length;
function punteggio(p){
  if (!p.giochi.length) return "";
  if (p.giochi.length === 1) return `${p.giochi[0][0]}–${p.giochi[0][1]}`;
  const va = p.giochi.filter(g=>g[0]>g[1]).length, vb = p.giochi.length - va;
  return `${va}–${vb} <span class="muted">(${p.giochi.map(g=>g.join("-")).join(", ")})</span>`;
}
function formatoTesto(p){
  const r = p.regole, s = [];
  if (r.al_meglio_di === 3) s.push("2 su 3");
  if (r.vantaggio_a) s.push(`+${r.vantaggio_a} a ${p.a ? esc(p.a) : "vincenti"}`);
  return s.join(" · ");
}
function cardPartita(p, conAzioni=true){
  const fin = p.stato === "finita";
  const ca = fin ? (p.vincitore===p.a?"win":"lose") : "", cb = fin ? (p.vincitore===p.b?"win":"lose") : "";
  const tags = [];
  if (p.stato === "in_corso") tags.push(`<span class="pill live">Biliardino ${p.biliardino}</span>`);
  if (eMia(p)) tags.push('<span class="pill mine">Tua</span>');
  if (p.tavolino) tags.push('<span class="pill">Tavolino</span>');
  if (!fin && sospesa(p)) tags.push('<span class="pill warn">Stand-by</span>');
  if (!fin) [...mancanti(p.a), ...mancanti(p.b)].forEach(g => tags.push(`<span class="pill warn">Manca ${esc(g)}</span>`));
  if (p.proposta) tags.push(p.proposta.contestata ? '<span class="pill warn">Contestato</span>' : '<span class="pill warn">Da confermare</span>');
  const f = formatoTesto(p);
  let az = "";
  if (conAzioni && p.a && p.b && !p.bye){
    const btn = [];
    const prop = p.proposta;
    const altraPropone = prop && eMia(p) && !mie().includes(prop.da) && !fin;
    if (altraPropone && !prop.contestata && !admin()){
      btn.push(`<button class="b pri" onclick="conferma('${p.id}')">Conferma ${esc(prop.giochi.map(g=>g.join("-")).join(", "))}</button>`);
      btn.push(`<button class="b red" onclick="contesta('${p.id}')">Contesta</button>`);
    } else if (!fin && eMia(p) && !admin()){
      btn.push(`<button class="b ${p.stato==="in_corso"?"pri":""}" onclick="apriRisultato('${p.id}')">${prop && mie().includes(prop.da) ? "Modifica risultato" : "Inserisci risultato"}</button>`);
    }
    if (admin() && prop && !fin){
      const lab = g => esc(g.map(x=>x.join("-")).join(", "));
      btn.push(`<button class="b pri" onclick="confermaAdmin('${p.id}','p')">✓ ${lab(prop.giochi)}${prop.controproposta ? ` <small>(${esc(prop.da)})</small>` : ""}</button>`);
      if (prop.controproposta){
        const altra = prop.da === p.a ? p.b : p.a;
        btn.push(`<button class="b pri" onclick="confermaAdmin('${p.id}','c')">✓ ${lab(prop.controproposta)} <small>(${esc(altra)})</small></button>`);
      }
    }
    if (admin()){
      if (p.stato === "attesa" && S.pronte.includes(p.id))
        S.biliardini_liberi.forEach(b => btn.push(`<button class="b" onclick="avvia('${p.id}',${b})">▶ Biliardino ${b}</button>`));
      if (!fin && S.fase !== "finito"){
        btn.push(sospesa(p) ? `<button class="b" onclick="riattiva('${p.id}')">▶ Riattiva</button>`
                            : `<button class="b" onclick="sospendi('${p.id}')">⏸ Stand-by</button>`);
        btn.push(`<button class="b" onclick="apriPresenze('${p.id}')">🚶 Chi manca?</button>`);
      }
      const correggibile = p.tab !== "G" || S.fase === "gironi";
      if (correggibile) btn.push(`<button class="b ${p.stato==="in_corso"&&!prop?"pri":""}" onclick="apriRisultato('${p.id}')">${fin ? "Correggi" : prop ? "Altro risultato" : "Risultato"}</button>`);
    }
    if (btn.length) az = `<div class="actions">${btn.join("")}</div>`;
  }
  return `<div class="card match">
    <div class="lab">${esc(p.etichetta)}${f ? " · " + f : ""} ${tags.join(" ")}</div>
    <div class="team ${ca}">${esc(p.a || "—")}</div><div class="score">${fin ? punteggio(p) : ""}</div>
    <div class="team ${cb}">${esc(p.b || "—")}</div><div class="score"></div>
    ${p.proposta && !fin ? `<div class="lab">Proposto da ${esc(p.proposta.da)}: ${p.proposta.giochi.map(g=>g.join("-")).join(", ")}${p.proposta.controproposta ? " · l'altra coppia dice " + p.proposta.controproposta.map(g=>g.join("-")).join(", ") : ""}</div>` : ""}
    ${az}</div>`;
}

/* ---------- schede ---------- */
function render(){
  $("#titolo").textContent = S.torneo || "Torneo";
  $("#sottotitolo").textContent = FASI[S.fase] + (S.config ? ` · ${S.coppie.length} coppie · a ${S.config.gol} gol · ${S.config.biliardini} biliardini` : "");
  const schede = [];
  if (["gironi","ko","finito"].includes(S.fase)) schede.push(["partite","Partite"],["gironi","Gironi"]);
  if (["ko","finito"].includes(S.fase)) schede.push(["tabellone","Tabellone"]);
  if (admin()) schede.push(["admin","Gestione"]);
  if (admin()) { if (["nessuna","iscrizioni"].includes(S.fase)) schede.unshift(["tornei","Tornei"]); else schede.push(["tornei","Tornei"]); }
  if (!schede.length) schede.push(["attesa","Torneo"]);
  // Sfide per tutti: prima scheda per i giocatori quando non c'è un torneo in corso
  if (!["gironi","ko","finito"].includes(S.fase) && !admin()) schede.unshift(["sfide","Sfide"]); else schede.push(["sfide","Sfide"]);
  // Iscrizione per tutti: prima scheda dei giocatori prima del torneo, in fondo durante
  if (!["gironi","ko","finito"].includes(S.fase) && !admin()) schede.unshift(["iscrizione","Iscrizione"]); else schede.push(["iscrizione","Iscrizione"]);
  if (!tab || !schede.some(s=>s[0]===tab)) tab = schede[0][0];
  $("#prova").innerHTML = S.prova && veroAdmin()
    ? `<span>🧪 Torneo di prova — ${vistaGiocatore ? "vista giocatore" : "vista admin"}</span><button onclick="cambiaVista()">${vistaGiocatore ? "Torna admin" : "👤 Vista giocatore"}</button>${!vistaGiocatore && ["gironi","ko"].includes(S.fase) ? '<button onclick="simula()">🎲 Simula giro</button>' : ""}${!vistaGiocatore && S.fase === "gironi" ? '<button onclick="completaGironi()">⏩ Completa gironi</button>' : ""}`
    : (S.prova ? "<span>🧪 Torneo di prova</span>" : "");
  $("#prova").style.display = S.prova ? "flex" : "none";
  $("#tabs").innerHTML = schede.map(([k,n]) => `<button class="${k===tab?"on":""}" onclick="vai('${k}')">${n}</button>`).join("");
  const brkPrima = $("#brk"), scrollPrima = brkPrima ? brkPrima.scrollLeft : null;
  $("#main").className = "v-" + tab;
  $("#main").innerHTML = ({partite:vPartite, gironi:vGironi, tabellone:vTabellone, admin:vAdmin, attesa:vAttesa, tornei:vTornei, sfide:vSfide, iscrizione:vIscrizione})[tab]();
  const brk = $("#brk");
  if (brk){
    if (scrollPrima !== null) brk.scrollLeft = scrollPrima;
    else {   // prima apertura: parti dal 1° turno vincenti (il centro della farfalla)
      const w1 = [...brk.querySelectorAll(".ch")].find(e => e.textContent.startsWith("Vincenti 1") || e.textContent === "Finale vincenti");
      if (w1 && brk.scrollWidth > brk.clientWidth) brk.scrollLeft = Math.max(0, w1.offsetLeft - 40);
    }
  }
}
function vai(k){ tab = k; render(); window.scrollTo(0,0); if (k === "tornei") caricaPannello(); if (k === "sfide") caricaSfide(); if (k === "iscrizione") caricaIscrizione(); }

function vAttesa(){

function vPartite(){
  const P = S.partite.filter(p => !p.bye);
  let h = "";
  if (S.fase === "finito" && S.podio) h += vPodio();
  if (admin() && S.fase !== "finito"){
    const ass = Object.entries(S.assenti || {}).flatMap(([c, gs]) => gs.map(g => [c, g]));
    if (ass.length) h += `<section><h2>Non ancora arrivati</h2><div class="card">${ass.map(([c,g]) => `<div class="row"><span><b>${esc(g)}</b> <span class="muted">${esc(c)}</span></span><button class="b pri" onclick="presenza(${jsq(c)},${jsq(g)},false)">È arrivato</button></div>`).join("")}</div></section>`;
  }
  const daConfermare = P.filter(p => p.proposta && p.stato !== "finita" && (admin() || (eMia(p) && !mie().includes(p.proposta.da))))
    .sort((x, y) => (y.proposta.contestata ? 1 : 0) - (x.proposta.contestata ? 1 : 0));
  if (daConfermare.length) h += `<section><h2>${admin() ? "Risultati da confermare" : "Da confermare"}</h2>${daConfermare.map(p=>cardPartita(p)).join("")}</section>`;
  const mieP = P.filter(p => eMia(p) && p.stato !== "finita" && !daConfermare.includes(p));
  if (mieP.length) h += `<section><h2>Le tue partite</h2>${mieP.map(p=>cardPartita(p)).join("")}</section>`;
  const inCorso = P.filter(p => p.stato === "in_corso" && !mieP.includes(p) && !daConfermare.includes(p));
  if (inCorso.length) h += `<section><h2>In campo</h2>${inCorso.map(p=>cardPartita(p)).join("")}</section>`;
  if (admin() && S.fase !== "finito") h += `<section><button class="b pri big" onclick="chiama()" ${S.biliardini_liberi.length && S.pronte.length ? "" : "disabled"}>📣 Chiama partite (${S.biliardini_liberi.length} biliardini liberi)</button></section>`;
  const standby = P.filter(p => p.stato !== "finita" && (sospesa(p) || bloccata(p)) && !mieP.includes(p) && !daConfermare.includes(p) && !inCorso.includes(p));
  if (standby.length) h += `<section><h2>In stand-by / manca qualcuno</h2>${standby.map(p=>cardPartita(p)).join("")}</section>`;
  const pronte = P.filter(p => S.pronte.includes(p.id) && !mieP.includes(p) && !daConfermare.includes(p));
  if (pronte.length) h += `<section><h2>Prossime</h2>${pronte.map(p=>cardPartita(p)).join("")}</section>`;
  const attesa = P.filter(p => p.stato === "attesa" && p.a && p.b && !S.pronte.includes(p.id) && !mieP.includes(p) && !daConfermare.includes(p) && !standby.includes(p));
  if (attesa.length) h += `<section><h2>Da giocare</h2>${attesa.map(p=>cardPartita(p)).join("")}</section>`;
  const giocate = P.filter(p => p.stato === "finita").reverse();
  if (giocate.length) h += `<section><h2>Giocate</h2>${giocate.map(p=>cardPartita(p, admin())).join("")}</section>`;
  return h || '<div class="empty">Nessuna partita.</div>';
}

function vGironi(){

    <tr><th>#</th><th>Coppia</th><th>G</th><th>Pt</th><th>GF</th><th>GS</th><th>DG</th></tr>

  </table></div></section>`).join("") + '<p class="muted" style="margin:0 6px">Vittoria 3 pt · vittoria di un gol 2-1 · parità: differenza gol, scontro diretto, sorteggio.</p>';

let modoTab = "grafico";   // grafico (a farfalla) | elenco
let brkAdatta = false;     // tabellone rimpicciolito per stare tutto nello schermo
function vTabellone(){
  let h = S.fase === "finito" && S.podio ? vPodio() : "";
  h += `<section><div class="seg">${[["grafico","Tabellone"],["elenco","Elenco partite"]].map(([k,n]) =>

/* Tabellone a farfalla: perdenti a sinistra, vincenti a destra, finale in fondo a destra.
   Le lettere (A, B, C…) dicono dove scende chi perde nel tabellone vincenti. */
function vBracket(){
  const P = {}; S.partite.filter(p => p.tab !== "G").forEach(p => P[p.id] = p);
  const tutte = Object.values(P);
  if (!tutte.length) return '<div class="empty">Tabellone non ancora creato.</div>';
  const W = tutte.filter(p => p.tab === "W"), L = tutte.filter(p => p.tab === "L"), F = P["F"];
  const kW = Math.max(...W.map(p => p.turno)), kL = L.length ? Math.max(...L.map(p => p.turno)) : 0;
  const CW = 158, BH = 52, GAP = 28, STEP = 66, HEAD = 34, MID = 18;
  const idx = id => +id.split("-")[1] - 1;
  const ord = (a, b) => a.turno - b.turno || idx(a.id) - idx(b.id);
  // colonne: Perdenti kL … 1 | Vincenti 1 … kW | Finale
  const colX = {}; let x = 0;
  for (let j = kL; j >= 1; j--){ colX["L" + j] = x; x += CW + GAP; }
  x += MID;
  for (let r = 1; r <= kW; r++){ colX["W" + r] = x; x += CW + GAP; }
  colX.F = x; const larg = x + CW + 8;
  const X = p => colX[p.tab === "F" ? "F" : p.tab + p.turno];
  // lettere: perdenti dei turni vincenti dal 2° in poi
  const lettera = {}; W.filter(p => p.turno >= 2).sort(ord).forEach((p, i) => lettera[p.id] = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[i] || "?");
  // fonti "di linea" (stesso lato): vincente dal turno prima, o perdente del 1° turno vincenti
  const fontiLinea = q => [q.fonte_a, q.fonte_b].filter(f => f && P[f[1]] &&
      (f[0] === "v" ? P[f[1]].tab === q.tab || q.tab === "F" && P[f[1]].tab === "W" : P[f[1]].tab === "W" && P[f[1]].turno === 1));
  const y = {};
  W.filter(p => p.turno === 1).forEach(p => y[p.id] = HEAD + idx(p.id) * STEP + STEP / 2);
  [...W.filter(p => p.turno > 1), ...L].sort((a, b) => (a.tab === b.tab ? 0 : a.tab === "W" ? -1 : 1) || ord(a, b)).forEach(q => {
    const src = fontiLinea(q).map(f => y[f[1]]).filter(v => v !== undefined);
    y[q.id] = src.length ? src.reduce((a, b) => a + b, 0) / src.length : HEAD + STEP / 2;
  });
  if (F) y.F = y[F.fonte_a[1]];
  const alt = Math.max(...Object.values(y)) + BH / 2 + 26;
  // linee
  let linee = "";
  tutte.forEach(q => fontiLinea(q).forEach(f => {
    const s = P[f[1]]; if (y[s.id] === undefined) return;
    const versoDx = X(q) > X(s);               // vincenti e finale: da sinistra a destra
    const x1 = versoDx ? X(s) + CW : X(s), x2 = versoDx ? X(q) : X(q) + CW, xm = (x1 + x2) / 2;
    linee += `<path d="M${x1} ${y[s.id]}H${xm}V${y[q.id]}H${x2}"/>`;
  }));
  // intestazioni
  let h = "";
  for (let j = 1; j <= kL; j++) h += `<div class="ch" style="left:${colX["L"+j]}px">${j === kL ? "Finale perdenti" : "Perdenti " + j}</div>`;
  for (let r = 1; r <= kW; r++) h += `<div class="ch" style="left:${colX["W"+r]}px">${r === kW ? "Finale vincenti" : "Vincenti " + r}</div>`;
  if (F) h += `<div class="ch fin" style="left:${colX.F}px">Finale</div>`;
  const nome = (p, lato) => {
    const c = p[lato];
    if (c === "BYE") return `<span class="n muted"><i>BYE</i></span>`;
    const f = p["fonte_" + lato], src = f && P[f[1]];
    const lt = f && f[0] === "p" && lettera[f[1]] ? `<b class="ltin">${lettera[f[1]]}</b>` : "";
    if (c) return `<span class="n">${lt}${esc(c)}</span>`;
    if (!src) return `<span class="n muted">—</span>`;
    if (f[0] === "p") return `<span class="n muted">${lt || ""}Perdente ${lettera[f[1]] ? "" : "turno prima"}</span>`;
    return `<span class="n muted">${src.tab === "L" && p.tab === "F" ? "Vincente perdenti" : "…"}</span>`;
  };
  const punti = (p, lato) => {
    if (p.stato !== "finita" || p.bye || !p.giochi.length) return "";
    const i = lato === "a" ? 0 : 1;
    return p.giochi.length === 1 ? p.giochi[0][i] : p.giochi.filter(g => g[i] > g[1 - i]).length;
  };
  const cliccabile = p => p.a && p.b && !p.bye && (admin() || (eMia(p) && p.stato !== "finita"));
  tutte.forEach(p => {
    if (y[p.id] === undefined) return;
    const fin = p.stato === "finita", cl = lato => fin && !p.bye ? (p.vincitore === p[lato] ? "w" : "l") : "";
    const tag = p.stato === "in_corso" ? `<span class="tag">Biliardino ${p.biliardino}</span>`
              : p.proposta && !fin ? `<span class="tag warn">Da confermare</span>` : "";
    const cap = p.tab === "F" ? "vincente 1° · perdente 2°"
              : p.tab === "L" && p.turno === kL ? "vincente in finale · perdente 3°"
              : p.tab === "L" && p.turno === kL - 1 ? "perdente 4°" : "";
    h += `<div class="bx${p.stato==="in_corso"?" live":""}${eMia(p)?" mine":""}${p.bye?" bye":""}${cliccabile(p)?" ck":""}"
      style="left:${X(p)}px;top:${y[p.id] - BH/2}px" ${cliccabile(p) ? `onclick="apriRisultato('${p.id}')"` : ""}>
      ${tag}<div class="r ${cl("a")}">${nome(p,"a")}<b>${punti(p,"a")}</b></div>
      <div class="r ${cl("b")}">${nome(p,"b")}<b>${punti(p,"b")}</b></div>
      ${lettera[p.id] ? `<span class="lt">${lettera[p.id]}</span>` : ""}${cap ? `<span class="cap">${cap}</span>` : ""}</div>`;
  });
  const spazio = Math.max(200, ($("#main").clientWidth || window.innerWidth) - 40);
  const f = brkAdatta ? Math.min(1, spazio / larg) : 1;
  const zoom = larg > spazio ? `<button class="b" style="margin:0 0 8px" onclick="brkAdatta=!brkAdatta;render()">${brkAdatta ? "🔍 Ingrandisci" : "⤢ Vedi tutto il tabellone"}</button>` : "";
  return `${zoom}<div class="brk-wrap" id="brk"><div style="width:${larg*f}px;height:${alt*f}px"><div class="brk" style="width:${larg}px;height:${alt}px;transform:scale(${f});transform-origin:0 0">
    <svg width="${larg}" height="${alt}"><g>${linee}</g></svg>${h}</div></div></div>
    <p class="muted" style="margin:8px 6px">A sinistra il tabellone perdenti, a destra i vincenti. La lettera accanto a una partita dei vincenti indica dove scende chi perde. ${admin() ? "Tocca una partita per inserire o correggere il risultato." : "Tocca la tua partita per inserire il risultato."}</p>`;
}

function vElencoKO(){
  const P = S.partite.filter(p => p.tab !== "G");
  let h = "";
  const gruppi = {};
  P.forEach(p => { (gruppi[p.etichetta] = gruppi[p.etichetta] || []).push(p); });
  const ordine = Object.keys(gruppi);
  const W = ordine.filter(k => k.startsWith("Vincenti") || k==="Finale vincenti");
  const L = ordine.filter(k => k.startsWith("Perdenti") || k==="Finale perdenti");
  const blocco = (titolo, chiavi) => chiavi.length ? `<h2 style="margin-top:14px">${titolo}</h2><div class="turni">` + chiavi.map(k => `<section><h2>${esc(k)} · ${gruppi[k][0].regole.al_meglio_di===3?"2 su 3":"secca"}</h2>${gruppi[k].map(p => p.bye ? `<div class="card match"><div class="team">${esc(p.a==="BYE"?p.b:p.a) || "—"}</div><div class="score"><span class="pill">BYE</span></div></div>` : cardPartita(p, false)).join("")}</section>`).join("") + "</div>" : "";
  h += blocco("Tabellone vincenti", W) + blocco("Tabellone perdenti", L);
  if (gruppi["Finale"]) h += `<h2 style="margin-top:14px">Finale</h2>` + gruppi["Finale"].map(p=>cardPartita(p,false)).join("");
  return h;
}

function vPodio(){
  const m = ["🥇","🥈","🥉"];
  return `<section><div class="card podio">${S.podio.map((c,i)=>`<div>${m[i]} ${esc(c)}</div>`).join("")}</div></section>`;
}

let prev = null, metodo = "teste", nGironi = 2, manuale = {};

      </div>
      <button class="b big" onclick="anteprima(false)">Anteprima e durata stimata</button>

      ${prev ? vPrev() : ""}
    </section>`;

  }
  // gironi / ko / finito
  h += `<section><button class="b big" onclick="pdf()">📄 PDF stampabile in chat</button></section>`;
  if (S.url_tv) h += `<section><h2>Pagina TV</h2><div class="card"><div class="row"><span class="muted" style="word-break:break-all">${esc(S.url_tv)}</span><button class="b" onclick="copia()">Copia</button></div></div></section>`;
  if (S.fase === "gironi"){
    const mancano = S.partite.filter(p=>p.tab==="G" && p.stato!=="finita").length;
    h += `<section><button class="b pri big" onclick="tabellone()" ${mancano?"disabled":""}>Crea tabellone doppio KO</button><p class="muted" style="margin:8px 6px">${mancano ? `Mancano ${mancano} partite dei gironi.` : "Gironi conclusi: crea il tabellone. Dopo non si possono più correggere i gironi."}</p>
      <button class="b big" onclick="annullaGironi()">↩ Torna alla composizione dei gironi</button></section>`;

  if (S.fase === "ko" || S.fase === "finito")
    h += `<section><button class="b big" onclick="annullaTabellone()">↩ Torna ai gironi (cancella il tabellone)</button></section>`;
  if (S.fase !== "finito"){

      const manca = mancanti(c).includes(g);
      return `<button class="b ${manca?"red":""}" onclick="presenza(${jsq(c)},${jsq(g)},${!manca})">${manca?"✗":"✓"} ${esc(g)}</button>`; }).join("")}</span></div>`).join("")}</div>
      <p class="muted" style="margin:8px 6px">Tocca un giocatore per segnarlo assente: la sua coppia non viene chiamata e il campo passa alla partita successiva.</p></section>`;

  }
  h += `<section><button class="b red big" onclick="ricomincia()">Ricomincia da capo (cancella gironi e risultati)</button></section>`;
  return h;
}
function nomeTurno(k){
  if (k==="F") return "Finale";
  const p = S.partite.find(p=>p.chiave_turno===k);
  return p ? p.etichetta : k;
}
function impostazioni(){
  const c = S.config;

function apriRisultato(pid){
  const p = S.partite.find(x=>x.id===pid);
  const base = (p.proposta && p.proposta.giochi) || (p.giochi.length ? p.giochi : []);
  bozza = {p, giochi: base.map(g => ({vince: g[0]>g[1] ? "a" : "b", perde: Math.min(g[0],g[1])}))};
  if (!bozza.giochi.length) bozza.giochi.push({vince:null, perde:null});
  foglioAperto = true; disegnaFoglio();
  $("#veil").classList.add("on"); $("#sheet").classList.add("on");
}
function chiudiFoglio(){ foglioAperto=false; $("#veil").classList.remove("on"); $("#sheet").classList.remove("on"); render(); }
$("#veil").onclick = chiudiFoglio;
function giochiCompleti(){
  const p = bozza.p, gol = p.regole.gol, out = [];
  for (const g of bozza.giochi){ if (g.vince==null || g.perde==null) return null; out.push(g.vince==="a" ? [gol, g.perde] : [g.perde, gol]); }
  return out;
}
function stato(){
  const serve = Math.floor(bozza.p.regole.al_meglio_di/2)+1;
  let va=0, vb=0; bozza.giochi.forEach(g=>{ if(g.vince==="a")va++; if(g.vince==="b")vb++; });
  return {va, vb, serve, deciso: va===serve || vb===serve};
}
function disegnaFoglio(){
  const p = bozza.p, r = p.regole, gol = r.gol;
  // aggiunge/toglie partite secondo l'andamento
  let st = stato();
  while (!st.deciso && bozza.giochi.every(g=>g.vince && g.perde!=null) && bozza.giochi.length < r.al_meglio_di){ bozza.giochi.push({vince:null, perde:null}); st = stato(); }
  let va=0, vb=0, tronca=bozza.giochi.length;
  bozza.giochi.forEach((g,i)=>{ if(g.vince==="a")va++; if(g.vince==="b")vb++; if((va===st.serve||vb===st.serve) && tronca===bozza.giochi.length) tronca=i+1; });
  bozza.giochi = bozza.giochi.slice(0, tronca); st = stato();
  const giochiHtml = bozza.giochi.map((g,i) => {
    const perdeA = g.vince==="b"; // perdente = a: in finale parte dal vantaggio
    const min = perdeA ? (r.vantaggio_a||0) : 0;
    const chips = g.vince ? Array.from({length: gol-min}, (_,k)=>k+min).map(n=>`<button class="${g.perde===n?"on":""}" onclick="setPerde(${i},${n})">${n}</button>`).join("") : "";
    return `<div class="game"><div class="muted" style="margin-bottom:6px">${r.al_meglio_di>1?`Partita ${i+1} · `:""}chi ha vinto?</div>
      <div class="who"><button class="${g.vince==="a"?"on":""}" onclick="setVince(${i},'a')">${esc(p.a)}</button><button class="${g.vince==="b"?"on":""}" onclick="setVince(${i},'b')">${esc(p.b)}</button></div>
      ${g.vince ? `<div class="muted" style="margin-top:10px">Gol di ${esc(g.vince==="a"?p.b:p.a)} (chi perde)</div><div class="chips">${chips}</div>` : ""}</div>`;
  }).join("");
  const giochi = giochiCompleti(), pronto = giochi && st.deciso;
  const coppia = admin() ? "" : (mie().find(c=>c===p.a||c===p.b) || "");
  const riepilogo = giochi ? giochi.map(g=>g.join("–")).join("  ·  ") : "";
  $("#sheet").innerHTML = `<div class="muted">${esc(p.etichetta)}${r.al_meglio_di>1?" · al meglio di 3":""} · a ${gol} gol</div>
    <div style="font-weight:700;margin:4px 0 2px">${esc(p.a)} — ${esc(p.b)}</div>
    ${r.vantaggio_a ? `<div class="muted">${esc(p.a)} parte con ${r.vantaggio_a} gol: inserisci il punteggio finale reale.</div>` : ""}
    ${giochiHtml}
    <div class="sum">${riepilogo || "&nbsp;"}</div>
    <button class="b pri big" ${pronto?"":"disabled"} onclick="salvaRisultato()">${admin() ? "Salva risultato" : "Invia all'altra coppia"}</button>
    <button class="b big" style="margin-top:6px" onclick="chiudiFoglio()">Annulla</button>
    ${!admin() ? '<p class="muted" style="text-align:center">Il risultato vale quando l\'altra coppia lo conferma.</p>' : ""}`;
}
function setVince(i, lato){ const g=bozza.giochi[i]; if(g.vince!==lato){ g.vince=lato; g.perde=null; } disegnaFoglio(); }
function setPerde(i, n){ bozza.giochi[i].perde=n; disegnaFoglio(); }
async function salvaRisultato(){
  const giochi = giochiCompleti(), p = bozza.p;
  const r = await azione({azione: admin() ? "risultato" : "proponi", pid:p.id, giochi}, admin() ? "Risultato salvato" : "Inviato: aspetta la conferma");
  if (r) chiudiFoglio();
}

function podFoto(file){
  pod.prev = null;
  if (pod.url) URL.revokeObjectURL(pod.url);
  pod.foto = null; pod.url = null;
  if (!file) { render(); return; }
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {   // rimpicciolisco (max 2048 px, JPEG): upload veloce anche col telefono
    const k = Math.min(1, 2048 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b => { pod.foto = b; pod.url = URL.createObjectURL(b); render(); }, "image/jpeg", 0.88);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Foto non leggibile", true); };
  img.src = url;
}
async function podInvia(modo){

  if (pod.foto) f.append("foto", pod.foto, "podio.jpg");
  try{
    const r = await fetch("/api/pannello/podio", {method:"POST", headers:{"X-Init-Data":INIT}, body:f});
    const d = await r.json();
    if (!d.ok){ vibra("error"); toast(d.errore || "Errore", true); return null; }
    return d;
  }catch(e){ toast("Connessione assente", true); return null; }
}

  if (!d) return;
  if (!d.ok && d.sconosciuti){ sfChiedi(d.sconosciuti, 0); return; }
  if (!d.ok){ vibra("error"); toast(d.errore || "Errore", true); return; }
  vibra("success"); toast(d.testo);
  if (d.avviso) setTimeout(() => toast(d.avviso, true), 2700);
  sfB.va = 0; sfB.vb = 0; sfB.scelte = {}; if (d.nomi) sfB.g = d.nomi;
  await caricaSfide();
}
function sfChiedi(lista, k){
  if (k >= lista.length){ chiudiFoglio(); sfSalva(); return; }
  const u = lista[k], chiave = jsq(u.nome.toLowerCase());
  sfCoda = lista; sfK = k;
  const altri = SF.giocatori.filter(g => !u.simili.some(s=>s.id===g.id));
  apriFoglio(`<div style="font-weight:700;margin-bottom:4px">«${esc(u.nome)}» non è in elenco</div>
    <p class="muted" style="margin:0 0 8px">È il soprannome di un giocatore che c'è già, o è una persona nuova?</p>
    <div class="elenco">${u.simili.map(s=>`<button onclick="sfScelta(${chiave}, ${s.id})">È <b>${esc(s.nome)}</b></button>`).join("")}
      ${altri.length ? `<div style="padding:10px 4px"><select style="width:100%" onchange="if(this.value) sfScelta(${chiave}, +this.value)"><option value="">${u.simili.length ? "È un altro…" : "È il soprannome di…"}</option>${altri.map(g=>`<option value="${g.id}">${esc(g.nome)}</option>`).join("")}</select></div>` : ""}
      <button class="nuovo" onclick="sfScelta(${chiave}, 'nuovo')">➕ No, è un giocatore nuovo: «${esc(u.nome)}»</button></div>
    <div class="actions"><button class="b" onclick="chiudiFoglio()">Annulla</button></div>
    <p class="muted">Un soprannome vale per sempre: le sfide di «${esc(u.nome)}» andranno a quel giocatore. Gli admin ricevono un avviso.</p>`);
}
let sfCoda = [], sfK = 0;
function sfScelta(chiave, valore){ sfB.scelte[chiave] = valore; sfChiedi(sfCoda, sfK + 1); }
/* ultime sfide, classifica, medagliere */
function vSfUltime(){
  const u = SF.ultime;
  if (!u.totale) return '<div class="empty">Nessuna sfida registrata.</div>';
  let h = `<section><h2>Ultime sfide — pagina ${u.pagina}/${u.pagine} (${u.totale})</h2>${u.sfide.map(s=>{
    const wa = s.va > s.vb, wb = s.vb > s.va, puo = SF.admin || s.da === SF.uid;
    return `<div class="card"><div class="muted" style="display:flex;justify-content:space-between"><span>n° ${s.id} · ${s.data.slice(8,10)}/${s.data.slice(5,7)}/${s.data.slice(0,4)}</span>${puo ? `<button class="b red" style="padding:2px 8px" onclick="sfAnnulla(${s.id})">🗑</button>` : ""}</div>
      <div class="sfida-r" style="margin-top:4px"><span class="team ${wa?"win":wb?"lose":""}">${esc(s.a.join("-"))}</span><span class="x">${s.va}-${s.vb}</span><span class="team dx ${wb?"win":wa?"lose":""}">${esc(s.b.join("-"))}</span></div></div>`;
  }).join("")}`;
  if (u.pagine > 1) h += `<div class="actions"><button class="b" onclick="sfPag--;caricaSfide()" ${u.pagina<=1?"disabled":""}>‹ Più recenti</button><button class="b" onclick="sfPag++;caricaSfide()" ${u.pagina>=u.pagine?"disabled":""}>Più vecchie ›</button></div>`;
  return h + "</section>";
}
async function sfAnnulla(id){
  if (!await chiedi(`Annullare la sfida n° ${id}?\nLa classifica aggiornata va nel gruppo.`)) return;
  const d = await sfPost({azione:"annulla", id});
  if (!d) return;
  if (!d.ok){ vibra("error"); toast(d.errore || "Errore", true); return; }
  vibra("success"); toast(d.testo); if (d.avviso) setTimeout(() => toast(d.avviso, true), 2700);
  await caricaSfide();
}
function vSfClassifica(){
  const c = SF.classifica, med = ["🥇","🥈","🥉"];
  const sel = `<select onchange="sfAnno=+this.value;caricaSfide()">${SF.anni.map(a=>`<option ${a===c.anno?"selected":""}>${a}</option>`).join("")}</select>`;
  if (!c.righe.length) return `<section><h2>Classifica sfidine ${sel}</h2><div class="empty">Nessuna sfida nel ${c.anno}.</div></section>`;
  return `<section><h2>Classifica sfidine ${sel}</h2><div class="card"><table><tr><th>#</th><th>Giocatore</th><th>Elo</th><th>G</th><th>V</th><th>%</th></tr>
    ${c.righe.map((r,i)=>`<tr><td>${med[i] || i+1}</td><td>${esc(r.nome)}</td><td><b>${r.elo}</b></td><td>${r.g}</td><td>${r.v}</td><td>${r.perc}</td></tr>`).join("")}</table></div>
    <p class="muted" style="margin:0 6px">G = partite giocate · V = vinte · l'Elo parte da 1000 a inizio anno</p></section>`;
}
function vSfMedagliere(){
  const m = SF.medagliere, val = m.anno === null ? "sempre" : String(m.anno);
  const sel = `<select onchange="sfMed=this.value;caricaSfide()">${SF.anni.map(a=>`<option value="${a}" ${String(a)===val?"selected":""}>${a}</option>`).join("")}<option value="sempre" ${val==="sempre"?"selected":""}>Di sempre</option></select>`;
  if (!m.righe.length) return `<section><h2>Medagliere ${sel}</h2><div class="empty">Nessun podio registrato.</div></section>`;
  return `<section><h2>Medagliere ${sel}</h2><div class="card"><table><tr><th>#</th><th>Giocatore</th><th>🥇</th><th>🥈</th><th>🥉</th></tr>
    ${m.righe.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nome)}</td><td><b>${r.m[0]}</b></td><td>${r.m[1]}</td><td>${r.m[2]}</td></tr>`).join("")}</table></div>
    <p class="muted" style="margin:0 6px">Tornei conteggiati: ${m.contati} (esclusi i 5X)</p></section>`;
}

/* ---------- scheda Iscrizione (tutti i membri): come /iscrivi e /ritira ---------- */
let IS = null, isB = ["",""], isI = 0, isMod = "";   // isMod = coppia in modifica (cambia compagno)
async function caricaIscrizione(){
  try{
    const r = await fetch("/api/iscrizione", {headers:{"X-Init-Data":INIT}});
    const d = await r.json();
    if (!r.ok){ toast(d.errore || "Errore", true); return; }
    IS = d;
    if (tab === "iscrizione" && !foglioAperto) render();
  }catch(e){ toast("Connessione assente", true); }
}
async function isPost(dati){
  try{
    const r = await fetch("/api/iscrizione", {method:"POST", headers:{"X-Init-Data":INIT,"Content-Type":"application/json"}, body:JSON.stringify(dati)});
    const d = await r.json();
    if (!d.ok){ vibra("error"); toast(d.errore || "Errore", true); return null; }
    vibra("success"); toast(d.testo);
    if (d.avviso) setTimeout(() => toast(d.avviso, true), 2700);
    await caricaIscrizione();
    return d;
  }catch(e){ toast("Connessione assente", true); return null; }
}
const isSlot = i => `<button class="slot ${isB[i]?"on":""}" onclick="isApriElenco(${i})">${isB[i] ? esc(isB[i]) : "+ Giocatore " + (i+1)}</button>`;
function vIscrizione(){
  if (!IS) return '<div class="empty">Caricamento…</div>';
  const t = IS.torneo, n = IS.squadre.length, mie = IS.squadre.filter(c => c.mia);
  const pieno = n >= t.max, puo = t.aperte && !pieno && (IS.admin || !mie.length);
  let h = `<section><h2>${esc(t.nome)}</h2><div class="card">
    <div class="row"><span>Iscritte</span><b>${n}/${t.max}</b></div>
    ${t.conferma ? `<div class="ok-line">${esc(t.conferma.split("!")[0])}!</div>` : ""}
  </div></section>`;
  if (isMod) h += `<section><h2>Modifica ${esc(isMod)}</h2><div class="card">
      <div class="vs">${isSlot(0)}${isSlot(1)}</div>
      <p class="muted" style="margin:6px 2px 0">La coppia tiene il suo posto in lista.</p>
      <div class="actions"><button class="b" onclick="isAnnullaMod()">Annulla</button><button class="b pri" onclick="isSalvaMod()" ${isB[0]&&isB[1]?"":"disabled"}>Salva</button></div>
    </div></section>`;
  else if (!t.aperte) h += '<section><div class="card"><span class="muted">🔒 Iscrizioni chiuse.</span></div></section>';
  else if (pieno) h += `<section><div class="card"><span class="muted">Torneo al completo (${t.max} coppie): scrivi a un admin per la lista d'attesa.</span></div></section>`;
  else if (!puo) h += '<section><div class="card"><span class="muted">Sei già iscritto: per cambiare compagno usa «Modifica» qui sotto.</span></div></section>';
  else h += `<section><h2>Iscrivi la tua coppia</h2><div class="card">
      <div class="vs">${isSlot(0)}${isSlot(1)}</div>
      <button class="b pri big" style="margin-top:10px" onclick="isIscrivi()" ${isB[0]&&isB[1]?"":"disabled"}>Iscrivi${isB[0]&&isB[1] ? " " + esc(isB[0]+"-"+isB[1]) : ""}</button>
      <p class="muted" style="margin:6px 2px 0">${IS.gruppo ? "La lista aggiornata va in fondo al gruppo." : "⚠️ Nessun gruppo registrato."}</p>
    </div></section>`;
  if (mie.length) h += `<section><h2>${mie.length > 1 ? "Coppie iscritte da te" : "La tua coppia"}</h2><div class="card">${mie.map(c=>`<div class="row"><span>${esc(c.nome)}</span><span>${t.aperte || IS.admin ? `<button class="b" onclick="isApriMod(${jsq(c.nome)})">Modifica</button> ` : ""}<button class="b red" onclick="isRitira(${jsq(c.nome)})">Ritira</button></span></div>`).join("")}</div></section>`;
  h += `<section><h2>Coppie iscritte (${n})</h2><div class="card">${IS.squadre.map((c,i)=>`<div class="row"><span>${i+1}. ${esc(c.nome)}${c.mia ? ' <span class="pill mine">Tua</span>' : ""}</span></div>`).join("") || '<span class="muted">Ancora nessuna coppia</span>'}</div></section>`;
  return h;
}
function isApriElenco(i){
  isI = i;
  apriFoglio(`<div style="font-weight:700;margin-bottom:8px">Giocatore ${i+1}</div>
    <input class="t" id="isQ" placeholder="Cerca o scrivi un nome" autocomplete="off" oninput="isFiltra(this.value)">
    <div class="elenco" id="isEl"></div>
    <div class="actions">${isB[i] ? '<button class="b red" onclick="isMetti(null)">Togli</button>' : ""}<button class="b" onclick="chiudiFoglio()">Annulla</button></div>`);
  isFiltra("");
}
function isFiltra(q){
  const t = q.trim().toLowerCase(), altro = (isB[1-isI] || "").toLowerCase();
  const lista = IS.giocatori.filter(g => g.toLowerCase() !== altro && (!t || g.toLowerCase().includes(t)));
  const esatto = IS.giocatori.some(g => g.toLowerCase() === t);
  const gia = {};   // chi è già in una coppia iscritta non si può scegliere
  IS.squadre.filter(c => c.nome !== isMod).forEach(c => c.nome.split("-").forEach(g => gia[g.trim().toLowerCase()] = c.nome));
  lista.sort((x, y) => !!gia[x.toLowerCase()] - !!gia[y.toLowerCase()]);   // liberi in cima
  let h = lista.slice(0, 80).map(g => gia[g.toLowerCase()]
    ? `<button disabled style="opacity:.45">${esc(g)} <small>· già in ${esc(gia[g.toLowerCase()])}</small></button>`
    : `<button onclick="isMetti(${jsq(g)})">${esc(g)}</button>`).join("");
  if (t && !esatto) h += `<button class="nuovo" onclick="isMetti(${jsq(q.trim())})">➕ Giocatore nuovo: «${esc(q.trim())}»</button>`;
  if (lista.some(g => gia[g.toLowerCase()]))
    h += '<p class="muted" style="margin:8px 4px">I nomi in grigio sono già iscritti. È un\'altra persona con lo stesso nome? Scrivila con l\'iniziale del cognome, es. «Gianni G.»</p>';
  $("#isEl").innerHTML = h || '<p class="muted">Nessun giocatore: scrivi il nome.</p>';
}
function isMetti(nome){ isB[isI] = nome || ""; chiudiFoglio(); render(); }
async function isIscrivi(){
  if (await isPost({azione:"iscrivi", g1:isB[0], g2:isB[1]})) isB = ["",""];
}
function isApriMod(nome){ isMod = nome; isB = nome.split("-").map(x => x.trim()).concat(["",""]).slice(0,2); render(); scrollTo(0,0); }
function isAnnullaMod(){ isMod = ""; isB = ["",""]; render(); }
async function isSalvaMod(){
  if (await isPost({azione:"modifica", nome:isMod, g1:isB[0], g2:isB[1]})) { isMod = ""; isB = ["",""]; render(); }
}
async function isRitira(nome){
  if (!await chiedi(`Ritirare ${nome} dal torneo?\nLa lista aggiornata va nel gruppo.`)) return;
  isPost({azione:"ritira", nome});
}

carica(true);
setInterval(() => { if (!document.hidden) carica(); }, 4000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) carica(); });
</script>
