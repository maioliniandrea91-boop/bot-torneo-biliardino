<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabellone torneo</title>
<style>
@font-face{font-family:"Bebas";src:url(/assets/BebasNeue-Regular.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Yellowtail";src:url(/assets/Yellowtail-Regular.ttf) format("truetype");font-display:swap}
:root{--bg:#06191a;--card:#0d2a2b;--card2:#123637;--tx:#f2fbfa;--hint:#7fb3b0;--acc:#b8f53f;--ok:#22bdb7;--mag:#ff2bd6;--line:#1d4746;--u:clamp(12px,1.05vw,26px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:500 var(--u)/1.3 "Segoe UI",system-ui,Roboto,sans-serif;overflow:hidden}
.wrap{height:100%;display:grid;grid-template-rows:auto 1fr;padding:1.2em 1.6em;gap:1em}
.top{display:flex;align-items:center;gap:1em}
.top img{height:4.6em;width:auto;margin:-.6em 0 -.6em -.3em}
.top .bil{font:400 2.1em/1 "Yellowtail",cursive;color:#fff;text-shadow:0 0 .12em var(--mag),0 0 .35em var(--mag),0 0 .7em #d4008f}
h1,h2,.fase,.tav .n,.gradino .nome{font-family:"Bebas",Impact,sans-serif;font-weight:400}
.top h1{font-size:3em;margin:0;letter-spacing:.02em;line-height:1}
.top .fase{color:var(--acc);font-size:1.8em;letter-spacing:.06em}
.top .ora{margin-left:auto;font-size:2em;font-weight:700;font-variant-numeric:tabular-nums;color:var(--hint)}
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:1.2em;min-height:0}
.col{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1em}
h2{margin:0 0 .4em;font-size:1.35em;letter-spacing:.08em;color:var(--ok)}
.gironi{display:grid;grid-template-columns:repeat(auto-fit,minmax(18em,1fr));gap:1em;align-content:start}
.box{background:var(--card);border-radius:.8em;padding:.9em 1em}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.75em;color:var(--hint);text-align:right;font-weight:600;padding:.2em .3em}
td{padding:.35em .3em;text-align:right;font-size:1.05em}
td:nth-child(2),th:nth-child(2){text-align:left;width:100%}
td:first-child{color:var(--hint);width:1.4em}
tr+tr td{border-top:1px solid var(--line)}
td.pt{font-weight:800;color:var(--acc)}
.rit{text-decoration:line-through;color:var(--hint)}
.campo{display:grid;gap:.7em}
.tav{display:grid;grid-template-columns:6.5em 1fr;gap:.9em;align-items:center;background:var(--card2);border-radius:.8em;padding:.8em 1em;border-left:.3em solid var(--ok)}
.tav .n{font-size:2.6em;font-weight:900;color:var(--ok);text-align:center;line-height:1}
.tav .n small{display:block;font-size:.3em;letter-spacing:.1em;color:var(--hint);font-weight:700}
.tav.libero{border-left-color:var(--line);opacity:.5}.tav.libero .n{color:var(--hint)}
.vs{font-size:1.3em;font-weight:700;line-height:1.25}
.vs span{color:var(--hint);font-weight:500;font-size:.75em;margin:0 .3em}
.lab{font-size:.8em;color:var(--hint)}
.lista .r{display:flex;gap:.8em;padding:.45em 0;align-items:baseline}
.lista .r+.r{border-top:1px solid var(--line)}
.lista .r .s{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.w{color:var(--ok)}
.ko{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.8em;align-items:start}
.ko .m{background:var(--card2);border-radius:.6em;padding:.45em .7em;margin-bottom:.5em;font-size:.95em}
.ko .m span{overflow:hidden;text-overflow:ellipsis}
.ko .m div{display:flex;justify-content:space-between;gap:.5em;white-space:nowrap;overflow:hidden}
.ko .m .p{color:var(--hint)}
.ko .m.live{outline:.15em solid var(--ok)}
.podio{display:flex;align-items:flex-end;justify-content:center;gap:1.5em;height:100%}
.gradino{text-align:center;width:22%}
.gradino .nome{font-size:2.6em;margin-bottom:.3em}
.gradino .base{background:var(--card2);border-radius:.6em .6em 0 0;display:flex;align-items:center;justify-content:center;font-size:4em}
.vuoto{color:var(--hint);text-align:center;margin-top:20vh;font-size:2em}
/* fase a eliminazione: tabellone a farfalla sopra, striscia con campi/prossime/ultimi sotto */
.grid.kofase{grid-template-columns:1fr;grid-template-rows:1fr auto}
.brkbox{min-height:0;background:var(--card);border-radius:.8em;padding:.6em;position:relative;overflow:hidden}
.brkfit{position:absolute;left:50%;top:50%}
.brk{position:relative;transform-origin:0 0}
.brk svg{position:absolute;left:0;top:0}
.brk path{fill:none;stroke:#3b6d6b;stroke-width:2}
.brk .ch{position:absolute;top:0;width:190px;font:400 22px/1 "Bebas",Impact,sans-serif;letter-spacing:.06em;color:var(--hint);white-space:nowrap}
.brk .ch.fin{color:var(--acc)}
.bx{position:absolute;width:190px;height:60px;background:var(--card2);border-radius:10px;border:2px solid transparent;padding:5px 10px;display:grid;grid-template-rows:1fr 1fr;font-size:16px;line-height:1.1}
.bx .r{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.bx .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bx .r b{font-variant-numeric:tabular-nums}
.bx .r.w{color:var(--ok);font-weight:800}.bx .r.l{color:var(--hint)}
.bx .muted{color:var(--hint)}
.bx.live{border-color:var(--acc);box-shadow:0 0 14px rgba(184,245,63,.35)}
.bx.bye{opacity:.4}
.bx .tag{position:absolute;top:-11px;left:10px;font-size:12px;font-weight:800;background:var(--acc);color:#06191a;border-radius:6px;padding:1px 6px}
.bx .lt{position:absolute;right:-27px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--ok);color:#06191a;font-size:13px;font-weight:900;display:grid;place-items:center}
.bx .ltin{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#06191a;font-size:11px;font-weight:900;margin-right:5px;vertical-align:1px}
.bx .cap{position:absolute;left:2px;bottom:-19px;font-size:12px;color:var(--hint);white-space:nowrap}
.striscia{display:grid;grid-template-columns:2.2fr 1fr 1fr;gap:1em;align-items:start;font-size:.78em}
.striscia h2{margin-bottom:.25em}
.striscia .box{padding:.6em .9em}
.striscia .lista .r{padding:.25em 0}
.striscia .lista .r>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.striscia .tav .lab{display:none}
.striscia .campo{grid-auto-flow:column;grid-auto-columns:1fr}
.striscia .tav{grid-template-columns:4.5em 1fr;padding:.6em .8em}
.striscia .tav .n{font-size:2em}
.striscia .vs{font-size:1.1em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/static/mascotte.png" alt=""><span class="bil">Biliardino</span><h1 id="nome">Torneo</h1><div class="fase" id="fase"></div><div class="ora" id="ora"></div></div>
  <div class="grid" id="corpo"><div class="vuoto">Caricamento…</div></div>
</div>
<script>
const TOKEN = location.pathname.split("/").pop();
const FASI = {nessuna:"In preparazione", iscrizioni:"In preparazione", gironi:"Gironi", ko:"Tabellone", finito:"Concluso"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null;
const sc = p => p.giochi.length === 1 ? p.giochi[0].join("–") :
  `${p.giochi.filter(g=>g[0]>g[1]).length}–${p.giochi.filter(g=>g[1]>g[0]).length}`;

async function carica(){
  try{
    const r = await fetch(`/api/stato?tv=${encodeURIComponent(TOKEN)}` + (S ? `&v=${encodeURIComponent(S.versione)}` : ""));
    if (!r.ok) return;
    const d = await r.json();
    if (d.invariato) return;
    S = d; render();
  }catch(e){}
}

function render(){
  document.getElementById("nome").textContent = S.torneo || "Torneo";
  document.getElementById("fase").textContent = FASI[S.fase];
  const c = document.getElementById("corpo");
  if (!S.partite){ c.innerHTML = '<div class="vuoto" style="grid-column:1/-1">Il torneo sta per iniziare</div>'; return; }
  if (S.fase === "finito" && S.podio){ c.style.gridTemplateColumns="1fr"; c.innerHTML = podio(); return; }
  c.style.gridTemplateColumns = "";
  if (S.fase === "ko"){
    c.className = "grid kofase";
    c.innerHTML = `<div class="brkbox" id="brkbox">${tabellone()}</div>
      <div class="striscia">${campo()}${prossime()}${ultimi()}</div>`;
    adatta();
    return;
  }
  c.className = "grid";
  c.innerHTML = `<div class="col">${S.fase === "gironi" ? gironi() : tabellone()}</div><div class="col">${campo()}${prossime()}${ultimi()}</div>`;
}

function gironi(){
  return `<div class="gironi">${S.gironi.map(g => `<div class="box"><h2>${esc(g.nome)}</h2><table>
    <tr><th>#</th><th>Coppia</th><th>G</th><th>Pt</th><th>DG</th></tr>
    ${g.classifica.map(r=>`<tr><td>${r.pos}</td><td class="${S.ritirate.includes(r.coppia)?"rit":""}">${esc(r.coppia)}</td><td>${r.g}</td><td class="pt">${r.pt}</td><td>${r.dg>0?"+":""}${r.dg}</td></tr>`).join("")}
  </table></div>`).join("")}</div>`;
}

/* Tabellone a farfalla (come il foglio del circolo): perdenti a sinistra,
   vincenti a destra, finale in fondo a destra. Le lettere indicano dove
   scende chi perde nel tabellone vincenti. Si adatta allo spazio (adatta()). */
function tabellone(){
  const P = {}; S.partite.filter(p => p.tab !== "G").forEach(p => P[p.id] = p);
  const tutte = Object.values(P);
  const W = tutte.filter(p => p.tab === "W"), L = tutte.filter(p => p.tab === "L"), F = P["F"];
  const kW = Math.max(...W.map(p => p.turno)), kL = L.length ? Math.max(...L.map(p => p.turno)) : 0;
  const CW = 190, BH = 60, GAP = 34, STEP = 78, HEAD = 40, MID = 24;
  const idx = id => +id.split("-")[1] - 1;
  const ord = (a, b) => a.turno - b.turno || idx(a.id) - idx(b.id);
  const colX = {}; let x = 0;
  for (let j = kL; j >= 1; j--){ colX["L" + j] = x; x += CW + GAP; }
  x += MID;
  for (let r = 1; r <= kW; r++){ colX["W" + r] = x; x += CW + GAP; }
  colX.F = x; const larg = x + CW + 4;
  const X = p => colX[p.tab === "F" ? "F" : p.tab + p.turno];
  const lettera = {}; W.filter(p => p.turno >= 2).sort(ord).forEach((p, i) => lettera[p.id] = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[i] || "?");
  const fontiLinea = q => [q.fonte_a, q.fonte_b].filter(f => f && P[f[1]] &&
      (f[0] === "v" ? P[f[1]].tab === q.tab || q.tab === "F" && P[f[1]].tab === "W" : P[f[1]].tab === "W" && P[f[1]].turno === 1));
  const y = {};
  W.filter(p => p.turno === 1).forEach(p => y[p.id] = HEAD + idx(p.id) * STEP + STEP / 2);
  [...W.filter(p => p.turno > 1), ...L].sort((a, b) => (a.tab === b.tab ? 0 : a.tab === "W" ? -1 : 1) || ord(a, b)).forEach(q => {
    const src = fontiLinea(q).map(f => y[f[1]]).filter(v => v !== undefined);
    y[q.id] = src.length ? src.reduce((a, b) => a + b, 0) / src.length : HEAD + STEP / 2;
  });
  if (F) y.F = y[F.fonte_a[1]];
  const alt = Math.max(...Object.values(y)) + BH / 2 + 26;
  let linee = "";
  tutte.forEach(q => fontiLinea(q).forEach(f => {
    const s = P[f[1]]; if (y[s.id] === undefined) return;
    const dx = X(q) > X(s), x1 = dx ? X(s) + CW : X(s), x2 = dx ? X(q) : X(q) + CW, xm = (x1 + x2) / 2;
    linee += `<path d="M${x1} ${y[s.id]}H${xm}V${y[q.id]}H${x2}"/>`;
  }));
  let h = "";
  for (let j = 1; j <= kL; j++) h += `<div class="ch" style="left:${colX["L"+j]}px">${j === kL ? "Finale perdenti" : "Perdenti " + j}</div>`;
  for (let r = 1; r <= kW; r++) h += `<div class="ch" style="left:${colX["W"+r]}px">${r === kW ? "Finale vincenti" : "Vincenti " + r}</div>`;
  if (F) h += `<div class="ch fin" style="left:${colX.F}px">Finale</div>`;
  const nome = (p, lato) => {
    const c = p[lato];
    if (c === "BYE") return `<span class="n muted"><i>BYE</i></span>`;
    const f = p["fonte_" + lato], src = f && P[f[1]];
    const lt = f && f[0] === "p" && lettera[f[1]] ? `<b class="ltin">${lettera[f[1]]}</b>` : "";
    if (c) return `<span class="n">${lt}${esc(c)}</span>`;
    if (!src) return `<span class="n muted">—</span>`;
    if (f[0] === "p") return `<span class="n muted">${lt}Perdente</span>`;
    return `<span class="n muted">${src.tab === "L" && p.tab === "F" ? "Vincente perdenti" : "…"}</span>`;
  };
  const punti = (p, lato) => {
    if (p.stato !== "finita" || p.bye || !p.giochi.length) return "";
    const i = lato === "a" ? 0 : 1;
    return p.giochi.length === 1 ? p.giochi[0][i] : p.giochi.filter(g => g[i] > g[1 - i]).length;
  };
  tutte.forEach(p => {
    if (y[p.id] === undefined) return;
    const fin = p.stato === "finita", cl = lato => fin && !p.bye ? (p.vincitore === p[lato] ? "w" : "l") : "";
    const cap = p.tab === "F" ? "vincente 1° · perdente 2°"
              : p.tab === "L" && p.turno === kL ? "vincente in finale · perdente 3°"
              : p.tab === "L" && p.turno === kL - 1 ? "perdente 4°" : "";
    h += `<div class="bx${p.stato==="in_corso"?" live":""}${p.bye?" bye":""}" style="left:${X(p)}px;top:${y[p.id] - BH/2}px">
      ${p.stato === "in_corso" ? `<span class="tag">BILIARDINO ${p.biliardino}</span>` : ""}
      <div class="r ${cl("a")}">${nome(p,"a")}<b>${punti(p,"a")}</b></div>
      <div class="r ${cl("b")}">${nome(p,"b")}<b>${punti(p,"b")}</b></div>
      ${lettera[p.id] ? `<span class="lt">${lettera[p.id]}</span>` : ""}${cap ? `<span class="cap">${cap}</span>` : ""}</div>`;
  });
  return `<div class="brkfit" id="brkfit" style="width:${larg}px;height:${alt}px"><div class="brk" id="brkin" style="width:${larg}px;height:${alt}px">
    <svg width="${larg}" height="${alt}">${linee}</svg>${h}</div></div>`;
}
/* scala il tabellone per stare tutto nel riquadro, centrato */
function adatta(){
  const box = document.getElementById("brkbox"), fit = document.getElementById("brkfit"), inn = document.getElementById("brkin");
  if (!box || !fit) return;
  const W = parseFloat(fit.style.width), H = parseFloat(fit.style.height);
  const k = Math.min((box.clientWidth - 16) / W, (box.clientHeight - 16) / H, 1.6);
  inn.style.transform = `scale(${k})`;
  fit.style.width = W * k + "px"; fit.style.height = H * k + "px";
  fit.style.marginLeft = -(W * k) / 2 + "px"; fit.style.marginTop = -(H * k) / 2 + "px";
  fit.dataset.w = W; fit.dataset.h = H;
}
window.addEventListener("resize", () => { if (S && S.fase === "ko") render(); });
function m(p){
  const f = p.stato === "finita", g = f ? p.giochi : [];
  const va = g.filter(x=>x[0]>x[1]).length, vb = g.filter(x=>x[1]>x[0]).length;
  const sa = !f ? "" : (g.length === 1 ? g[0][0] : va), sb = !f ? "" : (g.length === 1 ? g[0][1] : vb);
  const cl = x => f ? (p.vincitore === x ? "w" : "p") : "";
  return `<div class="m ${p.stato==="in_corso"?"live":""}"><div class="${cl(p.a)}"><span>${esc(p.a || "…")}</span><b>${sa}</b></div><div class="${cl(p.b)}"><span>${esc(p.b || "…")}</span><b>${sb}</b></div></div>`;
}

function campo(){
  const n = S.config.biliardini, inCorso = {};
  S.partite.filter(p=>p.stato==="in_corso").forEach(p => inCorso[p.biliardino] = p);
  let h = "";
  for (let b = 1; b <= n; b++){
    const p = inCorso[b];
    h += p ? `<div class="tav"><div class="n"><small>BILIARDINO</small>${b}</div><div><div class="lab">${esc(p.etichetta)}${p.regole.al_meglio_di===3?" · 2 su 3":""}${p.regole.vantaggio_a?` · +${p.regole.vantaggio_a} ${esc(p.a)}`:""}</div><div class="vs">${esc(p.a)}<span>vs</span>${esc(p.b)}</div></div></div>`
           : `<div class="tav libero"><div class="n"><small>BILIARDINO</small>${b}</div><div class="vs">Libero</div></div>`;
  }
  const ass = Object.entries(S.assenti || {}).flatMap(([c, gs]) => gs.map(g => `${esc(g)} <span class="lab">(${esc(c)})</span>`));
  const nSosp = (S.sospese || []).length;
  const attesa = ass.length || nSosp ? `<div class="box lista"><h2>In attesa</h2>${ass.length ? `<div class="r"><span>⏳ ${ass.join(", ")}</span></div>` : ""}${nSosp ? `<div class="r"><span class="lab">${nSosp} ${nSosp === 1 ? "partita" : "partite"} in stand-by</span></div>` : ""}</div>` : "";
  return `<div><h2>In campo</h2><div class="campo">${h}</div></div>${attesa}`;
}
const inAttesa = () => (S.sospese||[]).length || Object.keys(S.assenti||{}).length;
function prossime(){
  const ferme = p => (S.sospese||[]).includes(p.id) || ((S.assenti||{})[p.a]||[]).length || ((S.assenti||{})[p.b]||[]).length;
  const pronte = S.pronte.map(id => S.partite.find(p => p.id === id));
  const altre = S.partite.filter(p => p.stato === "attesa" && p.a && p.b && !p.bye && !S.pronte.includes(p.id) && !ferme(p));
  const ps = [...pronte, ...altre].slice(0, inAttesa() ? 3 : 4);
  if (!ps.length) return "";
  return `<div class="box lista"><h2>Prossime</h2>${ps.map(p=>`<div class="r"><span>${esc(p.a)} <span class="lab">vs</span> ${esc(p.b)}</span><span class="s lab">${esc(p.etichetta.replace("Girone ","").replace(" · giornata "," g"))}</span></div>`).join("")}</div>`;
}
function ultimi(){
  if (inAttesa()) return "";   // poco spazio: prima chi manca e le prossime
  const ps = S.partite.filter(p => p.stato === "finita" && !p.bye)
    .sort((a,b) => (a.finita_il||"").localeCompare(b.finita_il||"")).slice(inAttesa() ? -2 : -4).reverse();
  if (!ps.length) return "";
  return `<div class="box lista"><h2>Ultimi risultati</h2>${ps.map(p=>`<div class="r"><span><span class="${p.vincitore===p.a?"w":""}">${esc(p.a)}</span> <span class="lab">vs</span> <span class="${p.vincitore===p.b?"w":""}">${esc(p.b)}</span></span><span class="s">${sc(p)}</span></div>`).join("")}</div>`;
}
function podio(){
  const [p1,p2,p3] = S.podio;
  const g = (n, e, h) => `<div class="gradino"><div class="nome">${esc(n)}</div><div class="base" style="height:${h}vh">${e}</div></div>`;
  return `<div class="podio">${g(p2,"🥈",22)}${g(p1,"🥇",34)}${g(p3,"🥉",14)}</div>`;
}

function orologio(){ document.getElementById("ora").textContent = new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
orologio(); setInterval(orologio, 10000);
carica(); setInterval(carica, 4000);
</script>
</body>
</html>
