# Blocca i deploy durante il torneo e se i test falliscono: Railway ("Wait for CI") pubblica solo se
# questo controllo passa. Finestra vietata: venerdì 20:00 – sabato 05:00 (Roma).
name: Controlli prima del deploy
on:
  push:
    branches: [main]
jobs:
  controllo-orario:
    runs-on: ubuntu-latest
    steps:
      - name: Niente deploy durante il torneo
        run: |
          giorno=$(TZ=Europe/Rome date +%u)   # 5 = venerdì, 6 = sabato
          ora=$(TZ=Europe/Rome date +%H)
          echo "Ora di Roma: $(TZ=Europe/Rome date '+%A %H:%M')"
          if { [ "$giorno" = 5 ] && [ "$ora" -ge 20 ]; } || { [ "$giorno" = 6 ] && [ "$ora" -lt 5 ]; }; then
            echo "::error::Torneo in corso (ven 20:00 - sab 05:00): deploy bloccato. Ripubblica dopo le 05:00 di sabato."
            exit 1
          fi
          echo "Fuori dalla finestra del torneo: deploy consentito."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dipendenze
        run: pip install -r requirements.txt
      - name: Test motore torneo
        run: python test_motore.py
      - name: Test app tornei
        run: python test_app_tornei.py
      - name: Test funzioni (annulla, PDF, backup…)
        run: python test_funzioni.py
